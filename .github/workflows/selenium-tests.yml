name: Selenium tests

on:
  push:
    branches:
      - feature/homepage-tests

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CI: "true"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Selenium tests
        run: mvn --batch-mode clean test